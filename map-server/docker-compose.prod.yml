version: '3.8'

services:
  # 1. Redis (Cache & Queue)
  redis:
    image: redis:alpine
    container_name: map_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # 2. Backend (Node.js)
  backend:
    image: august0508/map-backend:latest
    container_name: map_backend
    restart: always
    depends_on:
      - redis
    environment:
      - PORT=4000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Cập nhật tên miền HTTPS
      - FRONTEND_URL=https://se2025-17-3.codes
      # Các biến này sẽ được lấy từ file .env do GitHub Actions tạo ra
      - MONGO_URI=${MONGO_URI}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - RECAPTCHA_V2_SECRET_KEY=${RECAPTCHA_V2_SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - EMAIL_USERNAME=${EMAIL_USERNAME}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    networks:
      - app-network

  # 3. Frontend (Nginx)
  frontend:
    image: august0508/map-frontend:latest
    container_name: map_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443" # Mở thêm port HTTPS
    volumes:
      # Mount chứng chỉ SSL từ máy chủ vào container (Chế độ chỉ đọc)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Mount file cấu hình Nginx
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge