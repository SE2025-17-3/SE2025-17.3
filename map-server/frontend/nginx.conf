# frontend/nginx.conf

upstream backend_upstream {
    server backend:4000;
    keepalive 64; # Giữ 64 kết nối rảnh rỗi để tái sử dụng
}

# --- KHỐI 1: CHUYỂN HƯỚNG HTTP SANG HTTPS ---
server {
    listen 80;
    server_name se2025-17-3.codes www.se2025-17-3.codes;

    # Chuyển hướng 301 vĩnh viễn sang HTTPS
    return 301 https://$host$request_uri;
}

# --- KHỐI 2: XỬ LÝ CHÍNH TRÊN HTTPS (443) ---
server {
    listen 443 ssl;
    server_name se2025-17-3.codes www.se2025-17-3.codes;

    # --- CẤU HÌNH SSL ---
    ssl_certificate /etc/letsencrypt/live/se2025-17-3.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/se2025-17-3.codes/privkey.pem;

    # Chuẩn bảo mật TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- TỐI ƯU & GIỚI HẠN ---
    # Tối ưu nén dữ liệu
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1000;

    # Cho phép upload ảnh avatar lớn hơn (ví dụ 10MB)
    client_max_body_size 10M;

    # --- CÁC LOCATION ---

    # 1. Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API Backend (Đã tối ưu chịu tải cao)
    location /api/ {
        # Dùng upstream đã định nghĩa ở trên
        proxy_pass http://backend_upstream;

        # Cấu hình bắt buộc cho keepalive
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Tắt buffer để phản hồi nhanh hơn cho các file nhỏ (Chunks)
        proxy_buffering off;

        # Các header chuẩn
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. Ảnh Avatar
    location /avatars/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        # Cache ảnh ở trình duyệt 30 ngày để giảm tải cho server
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Socket.IO
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}