server {
    listen 80;
    
    # Nén dữ liệu để tải nhanh hơn
    gzip on;
    gzip_types text/plain application/javascript text/css;

    # Frontend (React/Vite)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # API Backend (Chuyển tiếp sang container backend port 4000)
    # Lưu ý: server.js của bạn không có prefix /api, nên proxy thẳng
    # Nếu frontend gọi /auth/login -> backend nhận /auth/login
    location /auth/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
    
    location /users/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
    }
    location /avatars/ {
            proxy_pass http://backend:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }
    
    # Cấu hình chung cho các endpoint khác nếu cần, hoặc dùng /api nếu bạn gom routes
    # Ở đây tôi proxy các route phổ biến dựa trên thư mục controllers của bạn
    location /teams/ {
        proxy_pass http://backend:4000;
    }
    location /pixels/ {
        proxy_pass http://backend:4000;
    }
    location /leaderboard/ {
        proxy_pass http://backend:4000;
    }

    # Socket.IO (Realtime)
    location /socket.io/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}