# frontend/nginx.conf

upstream backend_upstream {
    server backend:4000;
    keepalive 64;
}

# --- KHỐI 1: CHUYỂN HƯỚNG HTTP SANG HTTPS ---
server {
    listen 80;
    server_name se2025-17-3.codes www.se2025-17-3.codes;
    return 301 https://$host$request_uri;
}

# --- KHỐI 2: XỬ LÝ CHÍNH TRÊN HTTPS (443) ---
server {
    listen 443 ssl;
    server_name se2025-17-3.codes www.se2025-17-3.codes;

    # --- CẤU HÌNH SSL ---
    ssl_certificate /etc/letsencrypt/live/se2025-17-3.codes/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/se2025-17-3.codes/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- TỐI ƯU & GIỚI HẠN ---
    gzip on;
    gzip_types text/plain application/javascript text/css application/json;
    gzip_min_length 1000;
    client_max_body_size 10M;

    # --- CÁC LOCATION ---

    # 1. Frontend
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. API Backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 3. File tĩnh (Ảnh) - ĐÃ SỬA TỪ /avatars/ THÀNH /public/
    # Backend đã config: app.use('/public', ...) nên Nginx phải hứng /public/
    location /public/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # 4. Socket.IO
    location /socket.io/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
