# frontend/nginx.conf

server {
    listen 80;
    server_name 136.112.99.88;

    # Cấu hình để phục vụ các file tĩnh của React
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dòng này rất quan trọng cho các Single Page App (SPA) như React
        try_files $uri $uri/ /index.html;
    }

    # === PHẦN REVERSE PROXY QUAN TRỌNG NHẤT ===
    # Khi có bất kỳ yêu cầu nào có URL bắt đầu bằng /api/
    location /api/ {
        # Nó sẽ chuyển tiếp yêu cầu đến container backend
        # 'backend' là tên service trong file docker-compose.yml
        # 4000 là port mà backend container đang lắng nghe
        proxy_pass http://backend:4000;

        # Các header cần thiết để chuyển tiếp thông tin client
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cấu hình xử lý lỗi
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}