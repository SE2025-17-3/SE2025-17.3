version: '3.8'

services:
  # Database Redis
  redis:
    image: redis:alpine
    container_name: map_redis
    restart: always
    volumes:
      - redis_data:/data
    networks:
      - app-network

  # Backend
  backend:
    image: august0508/map-backend:latest
    container_name: map_backend
    restart: always
    depends_on:
      - redis
    environment:
      - PORT=4000
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # QUAN TRỌNG: Đổi sang HTTPS và tên miền
      - FRONTEND_URL=https://se2025-17-3.codes
      # Các biến môi trường khác
      - MONGO_URI=${MONGO_URI}
      - DATABASE_URL=${DATABASE_URL}
      - SESSION_SECRET=${SESSION_SECRET}
      - RECAPTCHA_V2_SECRET_KEY=${RECAPTCHA_V2_SECRET_KEY}
    networks:
      - app-network

  # Frontend
  frontend:
    image: august0508/map-frontend:latest
    container_name: map_frontend
    restart: always
    ports:
      - "80:80"
      - "443:443" # <--- THÊM: Mở cổng HTTPS
    volumes:
      # <--- THÊM: Mount chứng chỉ từ máy chủ vào container (Chế độ chỉ đọc)
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # <--- THÊM: Mount file nginx.conf nằm cùng thư mục docker-compose vào container
      # Lưu ý: Nếu file config của bạn chỉ chứa khối 'server', hãy map vào /etc/nginx/conf.d/default.conf
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  redis_data:

networks:
  app-network:
    driver: bridge