name: Professional CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: BUILD VÀ ĐẨY IMAGE LÊN DOCKER HUB
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          # Đã khớp với ảnh: DOCKER_USERNAME
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/map-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-backend:buildcache,mode=max

      # Build Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/map-frontend:latest
          build-args: |
            # Đã khớp với ảnh: VITE_RECAPTCHA_V2_SITE_KEY
            VITE_RECAPTCHA_V2_SITE_KEY=${{ secrets.VITE_RECAPTCHA_V2_SITE_KEY }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-frontend:buildcache,mode=max

  # JOB 2: DEPLOY LÊN SERVER
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to get docker-compose.prod.yml
        uses: actions/checkout@v3

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@master
        with:
          # --- SỬA CÁC DÒNG NÀY ĐỂ KHỚP VỚI ẢNH CỦA BẠN ---
          host: ${{ secrets.SSH_HOST }}          # Trước là SERVER_IP
          username: ${{ secrets.SSH_USER }}      # Trước là SERVER_USER
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # -----------------------------------------------
          source: "map-server/docker-compose.prod.yml"
          # Sửa đường dẫn đích dùng biến SSH_USER
          target: "/home/${{ secrets.SSH_USER }}/deploy"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          # --- SỬA CÁC DÒNG NÀY ĐỂ KHỚP VỚI ẢNH CỦA BẠN ---
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # -----------------------------------------------
          script: |
            # Dùng đúng biến SSH_USER
            cd /home/${{ secrets.SSH_USER }}/deploy/map-server
            
            mv docker-compose.prod.yml docker-compose.yml
            
            # Tạo file .env từ Secrets (Đã chỉnh tên cho khớp ảnh)
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "DATABASE_URL=${{ secrets.MONGO_URI }}" >> .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            
            
            echo "RECAPTCHA_V2_SECRET_KEY=${{ secrets.RECAPTCHA_V2_SECRET_KEY }}" >> .env
            
            # Login Docker Hub
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            docker compose pull
            docker compose up -d
            docker image prune -f
