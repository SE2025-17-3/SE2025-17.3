# .github/workflows/deploy.yml

name: Build, Push, and Deploy on Main or Develop

on:
  push:
    branches:
      - main
      - develop

jobs:
  build_and_push:
    # ... (phần này không thay đổi)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Determine Image Tag
        id: get_tag
        run: |
          branch_name=${{ github.ref_name }}
          if [ "$branch_name" == "main" ]; then
            echo "TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "TAG=develop" >> $GITHUB_OUTPUT
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/backend
          push: true
          tags: august0508/map-app-backend:${{ steps.get_tag.outputs.TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/frontend
          push: true
          tags: august0508/map-app-frontend:${{ steps.get_tag.outputs.TAG }}

  deploy:
    runs-on: ubuntu-latest
    needs: build_and_push
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/se2025_17_3/SE2025-17.3
            git checkout develop
            git pull origin develop
            
            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_PASSWORD }}
            
            BRANCH_NAME=${{ github.ref_name }}
            if [ "$BRANCH_NAME" == "main" ]; then
              echo "🚀 Deploying PRODUCTION from 'main' branch..."
              docker compose -f docker-compose.prod.yml pull
              docker compose -f docker-compose.prod.yml up -d
            else
              echo "🚀 Deploying STAGING from 'develop' branch..."
              docker compose -f docker-compose.develop.yml pull
              docker compose -f docker-compose.develop.yml up -d
            fi
            
            echo "🧹 Cleaning up old images..."
            docker image prune -f
            echo "🎉 Deployment for $BRANCH_NAME completed!"