name: Professional CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: BUILD VÀ ĐẨY IMAGE LÊN DOCKER HUB
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/map-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-backend:buildcache,mode=max

      # Build Frontend
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/map-frontend:latest
          # QUAN TRỌNG: Truyền biến môi trường vào lúc build (cho Vite)
          build-args: |
            VITE_RECAPTCHA_V2_SITE_KEY=${{ secrets.VITE_RECAPTCHA_V2_SITE_KEY }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
            VITE_API_URL=https://se2025-17-3.codes/api
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-frontend:buildcache,mode=max

  # JOB 2: DEPLOY LÊN SERVER
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy docker-compose and nginx config to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Copy cả file docker-compose và nginx.conf
          source: "map-server/docker-compose.prod.yml,map-server/nginx.conf"
          target: "/home/${{ secrets.SSH_USER }}/deploy"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/deploy/map-server
            
            # Đổi tên file để dùng lệnh docker compose mặc định
            mv docker-compose.prod.yml docker-compose.yml
            
            # Tạo file .env từ Secrets
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "DATABASE_URL=${{ secrets.MONGO_URI }}" >> .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "RECAPTCHA_V2_SECRET_KEY=${{ secrets.RECAPTCHA_V2_SECRET_KEY }}" >> .env
            echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> .env
            echo "EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}" >> .env
            echo "EMAIL_PASSWORD=${{ secrets.EMAIL_PASSWORD }}" >> .env
            
            # Login Docker Hub
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # Pull và chạy container mới
            docker compose pull
            docker compose up -d
            docker image prune -f