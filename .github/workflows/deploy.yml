name: Professional CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # JOB 1: BUILD VÀ ĐẨY IMAGE LÊN DOCKER HUB
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # Build Backend
      - name: Build and Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/map-backend:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-backend:buildcache,mode=max

      # Build Frontend (Quan trọng: Phải truyền biến môi trường vào lúc build)
      - name: Build and Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./map-server/frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/map-frontend:latest
          build-args: |
            VITE_RECAPTCHA_V2_SITE_KEY=${{ secrets.VITE_RECAPTCHA_V2_SITE_KEY }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-frontend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/map-frontend:buildcache,mode=max

  # JOB 2: DEPLOY LÊN SERVER (CHỈ CHẠY KHI JOB 1 THÀNH CÔNG)
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code to get docker-compose.prod.yml
        uses: actions/checkout@v3

      - name: Copy docker-compose file to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Chỉ copy đúng file compose production
          source: "map-server/docker-compose.prod.yml"
          target: "/home/${{ secrets.SERVER_USER }}/deploy"

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ secrets.SSH_USER }}/deploy/map-server
            
            # Đổi tên file cho gọn
            mv docker-compose.prod.yml docker-compose.yml
            
            # Tạo file .env chứa bí mật (Runtime Secrets)
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" > .env
            echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> .env
            echo "DATABASE_URL=${{ secrets.MONGO_URI }}" >> .env
            echo "SESSION_SECRET=${{ secrets.SESSION_SECRET }}" >> .env
            echo "RECAPTCHA_V2_SECRET_KEY=${{ secrets.RECAPTCHA_V2_SECRET_KEY }}" >> .env
            
            # Login Docker trên Server (để pull image nếu để private, public thì không cần nhưng cứ login cho chắc)
            echo ${{ secrets.DOCKER_PASSWORD }} | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin
            
            # Pull Image mới nhất về
            docker compose pull
            
            # Up containers (Recreate if changed)
            docker compose up -d
            
            # Dọn dẹp images cũ (Dangling images) để không đầy ổ cứng
            docker image prune -f
