name: Continuous Integration (CI)

on:
  push:
    branches: [ "main" ]
    paths: 
      - "frontend/**"
      - "backend/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "frontend/**"
      - "backend/**"

jobs:
  # ======================================================
  # JOB 1: QUALITY CHECK (frontend + backend)
  # ======================================================
  quality-check:
    name: Quality Check (Test & Lint)
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        folder: [frontend, backend]  # Run checks for both folders
    
    defaults:
      run:
        working-directory: ./${{ matrix.folder }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # Node.js setup only for frontend (skip backend if not Node)
      - name: Setup Node.js
        if: matrix.folder == 'frontend'
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./frontend/package-lock.json

      # Install dependencies
      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          fi

      # Lint & test
      - name: Run Linter
        if: matrix.folder == 'frontend'
        run: npm run lint

      - name: Run Tests
        if: matrix.folder == 'frontend'
        run: npm test

      # Optional: backend linting (if you add ESLint or other checks)
      - name: Backend Check
        if: matrix.folder == 'backend'
        run: echo "Add backend lint/test commands if needed"

  # ======================================================
  # JOB 2: BUILD & PUSH DOCKER IMAGE
  # Only runs on push to main
  # ======================================================
  build-and-push:
    name: Build Docker Image
    needs: quality-check
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./                 # Root context to include frontend + backend
          file: ./Dockerfile          # Make sure you have a Dockerfile at the root
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/wplace-clone:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/wplace-clone:${{ github.sha }}
