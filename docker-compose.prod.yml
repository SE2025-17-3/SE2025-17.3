# docker-compose.prod.yml

version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: map-app-redis-prod 
    restart: unless-stopped
    networks:
      - map-app-network

  # Dịch vụ Backend cho Production
  backend:
    image: august0508/map-app-backend:latest # Sử dụng image tag ':latest' từ nhánh main
    container_name: map-app-backend-prod 
    restart: unless-stopped
    ports:
      - "4000:4000" # Có thể giữ nguyên hoặc đổi thành port khác nếu muốn
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - map-app-network

  # Dịch vụ Frontend cho Production
  frontend:
    image: august0508/map-app-frontend:latest # Sử dụng image tag ':latest' từ nhánh main
    container_name: map-app-frontend-prod 
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - map-app-network

networks:
  map-app-network:
    driver: bridge
